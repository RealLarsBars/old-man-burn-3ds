# Builds OldManBurn.cia and OldManBurn.3dsx on every change to main and publishes them as a GitHub Release.
# Pull requests get the same build (as a downloadable workflow artifact) but no release.
# The newest files are always at:
#   https://github.com/RealLarsBars/old-man-burn-3ds/releases/latest/download/OldManBurn.cia
#   https://github.com/RealLarsBars/old-man-burn-3ds/releases/latest/download/OldManBurn.3dsx
name: Build and release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'test/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      # The devkitarm image already ships these. pkg.devkitpro.org can refuse GitHub's runners (403),
      # so only sync pacman when one is actually missing.
      - name: Check the portlibs the game links against
        run: |
          pkgs="3ds-curl 3ds-mbedtls 3ds-jansson 3ds-zlib"
          dkp-pacman -Q $pkgs || dkp-pacman -Sy --needed --noconfirm $pkgs

      - name: Build makerom and bannertool
        run: |
          command -v cmake >/dev/null && command -v g++ >/dev/null || {
            apt-get update && apt-get install -y --no-install-recommends cmake g++ make git ca-certificates; }
          git clone -q --depth 1 --branch makerom-v0.18.4 https://github.com/3DSGuy/Project_CTR /tmp/ctr
          make -C /tmp/ctr/makerom deps -j"$(nproc)" >/dev/null
          make -C /tmp/ctr/makerom program -j"$(nproc)"
          git clone -q --depth 1 --branch 1.2.3 https://github.com/carstene1ns/3ds-bannertool /tmp/bt
          cmake -S /tmp/bt -B /tmp/bt/build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/bt/build -j"$(nproc)"
          mkdir -p /tmp/tools
          cp /tmp/ctr/makerom/bin/makerom /tmp/bt/build/bannertool /tmp/tools/

      - name: Build
        run: |
          export PATH="/tmp/tools:$PATH"
          make -j"$(nproc)" BUILD_NUM=${{ github.run_number }}
          make cia BUILD_NUM=${{ github.run_number }}
          ls -l OldManBurn.cia OldManBurn.3dsx

      - uses: actions/upload-artifact@v4
        with:
          name: OldManBurn-3ds
          path: |
            OldManBurn.cia
            OldManBurn.3dsx
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OldManBurn-3ds

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          tag="build-${{ github.run_number }}"
          short="${GITHUB_SHA::7}"
          subject="$(printf '%s\n' "$SUBJECT" | head -n1)"
          [ -n "$subject" ] || subject="Manual build"
          printf '%s\n\n%s\n\n%s\n' \
            "$subject" \
            "Built from $short on main. Install **OldManBurn.cia** with FBI (or another CIA installer) on a 3DS with custom firmware, or put **OldManBurn.3dsx** in \`sdmc:/3ds/\` for the Homebrew Launcher." \
            "Newest build any time: https://github.com/${GH_REPO}/releases/latest/download/OldManBurn.cia" > notes.md
          gh release create "$tag" OldManBurn.cia OldManBurn.3dsx \
            --target "$GITHUB_SHA" \
            --title "3DS build $(date -u +%Y-%m-%d) ($short)" \
            --notes-file notes.md \
            --latest
